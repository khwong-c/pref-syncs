name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v -o pref-syncs .

      - name: Test
        run: go test -json -v ./... 2>&1 | tee gotest.json

      - name: Test Report - Detailed
        uses: robherley/go-test-action@v1
        with:
          fromJSONFile: ./gotest.json
          omit: |
            untested
            stderr
            pie